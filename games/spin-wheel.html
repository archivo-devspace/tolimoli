<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spin & Select</title>
    <style>
      :root {
        --bg1: #05060a;
        --bg2: #0b1230;
        --card: rgba(255, 255, 255, 0.08);
        --card2: rgba(255, 255, 255, 0.12);
        --stroke: rgba(255, 255, 255, 0.16);
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.65);
        --good: #6ef3c5;
        --bad: #ff6b8a;
        --accent: #8a7dff;
        --accent2: #00d4ff;
        --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
        --radius: 18px;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        color: var(--text);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Arial,
          "Helvetica Neue",
          Helvetica,
          sans-serif;
        background:
          radial-gradient(
            1200px 800px at 15% 10%,
            rgba(138, 125, 255, 0.25),
            transparent 60%
          ),
          radial-gradient(
            900px 700px at 85% 15%,
            rgba(0, 212, 255, 0.2),
            transparent 55%
          ),
          radial-gradient(
            900px 700px at 40% 95%,
            rgba(110, 243, 197, 0.14),
            transparent 60%
          ),
          linear-gradient(160deg, var(--bg1), var(--bg2));
        overflow-x: hidden;
      }

      .wrap {
        width: min(1100px, 92vw);
        margin: 22px auto 40px;
        display: grid;
        gap: 18px;
      }

      header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 14px;
      }
      .title {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      h1 {
        margin: 0;
        font-size: clamp(20px, 3.2vw, 34px);
        letter-spacing: 0.2px;
      }
      .subtitle {
        margin: 0;
        color: var(--muted);
        font-size: clamp(12px, 1.6vw, 14px);
        line-height: 1.35;
      }

      .badge {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.1),
          rgba(255, 255, 255, 0.05)
        );
        border: 1px solid var(--stroke);
        border-radius: 999px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        user-select: none;
        white-space: nowrap;
        font-size: 13px;
        color: var(--muted);
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 99px;
        background: radial-gradient(
          circle at 30% 30%,
          #fff,
          rgba(255, 255, 255, 0.2) 35%,
          rgba(255, 255, 255, 0.05) 70%
        );
        box-shadow: 0 0 14px rgba(0, 212, 255, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.25);
      }

      .grid {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 18px;
      }

      @media (max-width: 900px) {
        .grid {
          grid-template-columns: 1fr;
        }
        header {
          align-items: flex-start;
          flex-direction: column;
        }
      }

      .card {
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.09),
          rgba(255, 255, 255, 0.05)
        );
        border: 1px solid var(--stroke);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        overflow: hidden;
        position: relative;
      }

      .card .inner {
        padding: 16px;
      }

      .wheelArea {
        display: grid;
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .wheelStage {
        position: relative;
        display: grid;
        place-items: center;
        padding: 16px;
      }

      canvas#wheel {
        width: min(520px, 86vw);
        height: min(520px, 86vw);
        max-width: 520px;
        max-height: 520px;
        border-radius: 999px;
        filter: drop-shadow(0 18px 38px rgba(0, 0, 0, 0.55));
        cursor: pointer;
      }

      .ring {
        position: absolute;
        width: min(520px, 86vw);
        height: min(520px, 86vw);
        max-width: 520px;
        max-height: 520px;
        border-radius: 999px;
        pointer-events: none;
        background:
          radial-gradient(
            circle at 30% 30%,
            rgba(255, 255, 255, 0.16),
            transparent 55%
          ),
          radial-gradient(
            circle at 70% 70%,
            rgba(0, 212, 255, 0.18),
            transparent 58%
          );
        border: 1px solid rgba(255, 255, 255, 0.16);
        box-shadow:
          inset 0 0 0 2px rgba(255, 255, 255, 0.06),
          inset 0 0 35px rgba(0, 0, 0, 0.35);
      }

      .pointer {
        position: absolute;
        top: 8px;
        width: 0;
        height: 0;
        border-left: 18px solid transparent;
        border-right: 18px solid transparent;
        border-top: 26px solid rgba(255, 255, 255, 0.92);
        filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.4));
        transform: translateY(0);
      }
      .pointer::after {
        content: "";
        position: absolute;
        left: -10px;
        top: -26px;
        width: 20px;
        height: 20px;
        border-radius: 999px;
        background: radial-gradient(
          circle at 30% 30%,
          #fff,
          rgba(255, 255, 255, 0.2) 35%,
          rgba(255, 255, 255, 0.05) 70%
        );
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 0 16px rgba(138, 125, 255, 0.55);
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: space-between;
        align-items: center;
      }

      .btnRow {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }

      button {
        appearance: none;
        border: 0;
        cursor: pointer;
        font-weight: 700;
        letter-spacing: 0.2px;
        color: rgba(255, 255, 255, 0.94);
        padding: 11px 14px;
        border-radius: 12px;
        transition:
          transform 0.12s ease,
          filter 0.12s ease,
          opacity 0.12s ease;
        user-select: none;
      }
      button:active {
        transform: translateY(1px) scale(0.99);
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .primary {
        background: linear-gradient(
          135deg,
          rgba(138, 125, 255, 0.95),
          rgba(0, 212, 255, 0.85)
        );
        box-shadow:
          0 14px 30px rgba(0, 212, 255, 0.18),
          0 12px 24px rgba(138, 125, 255, 0.18);
      }
      .ghost {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.16);
      }
      .danger {
        background: linear-gradient(
          135deg,
          rgba(255, 107, 138, 0.95),
          rgba(255, 162, 99, 0.85)
        );
      }

      .result {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        border-radius: 14px;
        background: rgba(0, 0, 0, 0.18);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }
      .result .label {
        color: var(--muted);
        font-size: 12px;
      }
      .result .name {
        font-size: 16px;
        font-weight: 800;
      }
      .pill {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.9);
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.14);
        padding: 6px 10px;
        border-radius: 999px;
      }

      .side {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .formRow {
        display: flex;
        gap: 10px;
      }
      input[type="text"] {
        flex: 1;
        padding: 12px 12px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(0, 0, 0, 0.2);
        color: var(--text);
        outline: none;
      }
      input[type="text"]::placeholder {
        color: rgba(255, 255, 255, 0.45);
      }

      .list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-height: 420px;
        overflow: auto;
        padding-right: 6px;
      }
      .list::-webkit-scrollbar {
        width: 10px;
      }
      .list::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.12);
        border-radius: 999px;
        border: 2px solid transparent;
        background-clip: padding-box;
      }

      .item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .left {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .chip {
        width: 12px;
        height: 12px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 0 14px rgba(255, 255, 255, 0.08);
        flex: 0 0 auto;
      }
      .who {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .who .n {
        font-weight: 800;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        cursor: text;
      }
      .who .s {
        font-size: 12px;
        color: var(--muted);
      }
      .miniBtn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        padding: 0;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.12);
        font-weight: 800;
        font-size: 16px;
        color: #ff6b8a;
        transition:
          transform 0.12s ease,
          background 0.12s ease,
          box-shadow 0.12s ease;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
      }
      .miniBtn:hover {
        transform: translateY(-2px) scale(1.02);
        background: linear-gradient(
          135deg,
          rgba(255, 107, 138, 0.06),
          rgba(255, 255, 255, 0.03)
        );
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.32);
      }
      .miniBtn:active {
        transform: translateY(0) scale(0.98);
      }
      /* Restore original Clear button hover (no extra transform/shadow) */
      #clearBtn:hover,
      #clearBtn:focus {
        transform: none;
        background: linear-gradient(
          135deg,
          rgba(255, 107, 138, 0.95),
          rgba(255, 162, 99, 0.85)
        );
        box-shadow: none;
      }
      #clearBtn:active {
        transform: translateY(1px) scale(0.99);
      }

      /* Winner dialog */
      .winnerOverlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: linear-gradient(rgba(3, 6, 12, 0.6), rgba(3, 6, 12, 0.6));
        z-index: 60;
      }
      /* Respect the hidden attribute so the dialog doesn't show initially */
      .winnerOverlay[hidden] {
        display: none !important;
        pointer-events: none !important;
      }
      .winnerCard {
        width: min(420px, 92vw);
        padding: 28px 22px;
        border-radius: 16px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.04),
          rgba(255, 255, 255, 0.02)
        );
        border: 1px solid rgba(255, 255, 255, 0.12);
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        position: relative;
        animation: popIn 360ms cubic-bezier(0.2, 0.9, 0.2, 1);
      }
      .winnerBadge {
        font-size: 44px;
        margin-bottom: 8px;
        filter: drop-shadow(0 10px 30px rgba(138, 125, 255, 0.25));
      }
      .winnerTitle {
        font-weight: 800;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .winnerName {
        font-size: 30px;
        font-weight: 900;
        color: var(--good);
        text-shadow:
          0 6px 30px rgba(110, 243, 197, 0.14),
          0 2px 8px rgba(0, 0, 0, 0.6);
        margin-bottom: 14px;
        animation: glowPulse 1600ms infinite ease-in-out;
      }
      #winnerClose {
        position: absolute;
        top: 12px;
        right: 12px;
        width: 36px;
        height: 36px;
        padding: 0;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.06);
        color: rgba(255, 255, 255, 0.9);
      }

      @keyframes glowPulse {
        0% {
          text-shadow:
            0 6px 30px rgba(110, 243, 197, 0.14),
            0 2px 8px rgba(0, 0, 0, 0.6);
        }
        50% {
          text-shadow:
            0 10px 46px rgba(110, 243, 197, 0.26),
            0 4px 14px rgba(0, 0, 0, 0.6);
        }
        100% {
          text-shadow:
            0 6px 30px rgba(110, 243, 197, 0.14),
            0 2px 8px rgba(0, 0, 0, 0.6);
        }
      }
      @keyframes popIn {
        from {
          transform: translateY(10px) scale(0.96);
          opacity: 0;
        }
        to {
          transform: translateY(0) scale(1);
          opacity: 1;
        }
      }

      .tip {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
      }

      /* confetti canvas on top */
      canvas#confetti {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <canvas id="confetti"></canvas>
    <!-- Winner dialog overlay -->
    <div
      id="winnerOverlay"
      class="winnerOverlay"
      role="dialog"
      aria-modal="true"
      hidden
    >
      <div class="winnerCard">
        <div class="winnerBadge">🎉</div>
        <div class="winnerTitle">Winner</div>
        <div class="winnerName" id="winnerPopupName">—</div>
        <button
          id="winnerClose"
          class="miniBtn"
          aria-label="Close winner dialog"
        >
          ✕
        </button>
      </div>
    </div>

    <div class="wrap">
      <header>
        <div class="title">
          <h1>Spin & Select</h1>
          <p class="subtitle">
            Add users, spin the wheel, accept your fate. The pointer decides.
            You just pretend you’re in control.
          </p>
        </div>
        <div class="badge">
          <span class="dot"></span>
          <span id="countBadge">0 users</span>
        </div>
      </header>

      <div class="grid">
        <!-- Wheel -->
        <section class="card">
          <div class="inner wheelArea">
            <div class="wheelStage">
              <div class="pointer" aria-hidden="true"></div>
              <canvas id="wheel" width="900" height="900"></canvas>
              <div class="ring" aria-hidden="true"></div>
            </div>

            <div class="controls">
              <div class="btnRow">
                <button id="shuffleBtn" class="ghost">Shuffle order</button>
              </div>
              <div class="result">
                <div>
                  <div class="label">Winner</div>
                  <div class="name" id="winnerName">—</div>
                </div>
                <div class="pill" id="spinInfo">Ready</div>
              </div>
            </div>

            <div class="tip">
              Tip: You can press <b>Enter</b> to add a user quickly. Mobile
              friendly because people insist on doing everything on phones now.
            </div>
          </div>
        </section>

        <!-- Users -->
        <aside class="card side">
          <div class="inner">
            <div class="formRow">
              <input
                id="nameInput"
                type="text"
                placeholder="Add user name..."
                maxlength="40"
              />
              <button id="addBtn" class="ghost">Add</button>
            </div>
          </div>

          <div class="inner" style="padding-top: 0">
            <div class="btnRow" style="justify-content: space-between">
              <div class="pill" id="hint">Add at least 2 users</div>
              <button id="clearBtn" class="danger">Clear</button>
            </div>
          </div>

          <div class="inner" style="padding-top: 0">
            <div class="list" id="userList"></div>
          </div>
        </aside>
      </div>
    </div>

    <script>
      // ---------- Helpers ----------
      const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
      const rand = (min, max) => Math.random() * (max - min) + min;

      function hashColor(i) {
        // pleasant neon-ish palette rotation
        const hues = [200, 260, 160, 320, 35, 120, 190, 280];
        const h = hues[i % hues.length];
        return `hsl(${h} 90% 60%)`;
      }

      // ---------- State ----------
      let users = ["Aye", "Ko", "Su", "Nanda"].map((n, i) => ({
        id: crypto.randomUUID(),
        name: n,
        color: hashColor(i),
      }));
      let isSpinning = false;
      let rotation = 0; // radians
      let targetIndex = null;

      // ---------- DOM ----------
      const wheelCanvas = document.getElementById("wheel");
      const ctx = wheelCanvas.getContext("2d");

      const confettiCanvas = document.getElementById("confetti");
      const cctx = confettiCanvas.getContext("2d");

      const nameInput = document.getElementById("nameInput");
      const addBtn = document.getElementById("addBtn");
      const clearBtn = document.getElementById("clearBtn");
      const shuffleBtn = document.getElementById("shuffleBtn");

      const userList = document.getElementById("userList");
      const winnerName = document.getElementById("winnerName");
      const spinInfo = document.getElementById("spinInfo");
      const countBadge = document.getElementById("countBadge");
      const hint = document.getElementById("hint");

      // ---------- Responsive canvas ----------
      function resizeConfetti() {
        confettiCanvas.width = window.innerWidth * devicePixelRatio;
        confettiCanvas.height = window.innerHeight * devicePixelRatio;
      }
      resizeConfetti();
      window.addEventListener("resize", resizeConfetti);

      // ---------- Render Users List ----------
      function renderList() {
        userList.innerHTML = "";
        users.forEach((u, idx) => {
          const row = document.createElement("div");
          row.className = "item";
          row.innerHTML = `
            <div class="left">
              <span class="chip" style="background:${u.color}"></span>
              <div class="who">
                <div class="n">${escapeHtml(u.name)}</div>
                <div class="s">Slice #${idx + 1}</div>
              </div>
            </div>
            <button class="miniBtn" data-id="${u.id}" title="Remove" aria-label="Remove user">✕</button>
          `;
          userList.appendChild(row);

          // make name editable on click
          const nameEl = row.querySelector(".n");
          if (nameEl) {
            nameEl.addEventListener("click", (e) => {
              e.stopPropagation();
              if (isSpinning) return;

              const input = document.createElement("input");
              input.type = "text";
              input.value = u.name;
              input.maxLength = 40;
              input.style.minWidth = "120px";
              input.style.padding = "6px 8px";
              input.style.borderRadius = "8px";
              input.style.border = "1px solid rgba(255,255,255,0.14)";
              input.style.background = "rgba(0,0,0,0.2)";
              input.style.color = "var(--text)";

              // replace name element with input
              nameEl.replaceWith(input);
              input.focus();
              input.select();

              const commit = () => {
                const val = input.value.trim();
                if (!val) {
                  pulseHint("Name cannot be empty");
                  input.focus();
                  return;
                }
                u.name = val;
                updateUI();
              };

              const cancel = () => {
                updateUI(); // rerender to restore original
              };

              input.addEventListener("keydown", (ev) => {
                if (ev.key === "Enter") commit();
                else if (ev.key === "Escape") cancel();
              });

              input.addEventListener("blur", () => {
                commit();
              });
            });
          }
        });

        userList.querySelectorAll("button[data-id]").forEach((btn) => {
          btn.addEventListener("click", () => {
            if (isSpinning) return;
            const id = btn.getAttribute("data-id");
            users = users.filter((u) => u.id !== id);
            syncColors();
            updateUI();
          });
        });
      }

      function escapeHtml(str) {
        return str.replace(
          /[&<>"']/g,
          (m) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#039;",
            })[m],
        );
      }

      function syncColors() {
        // Keep colors stable-ish but reassign if needed
        users = users.map((u, i) => ({ ...u, color: u.color || hashColor(i) }));
      }

      // ---------- Wheel Drawing ----------
      function drawWheel() {
        const dpr = devicePixelRatio || 1;
        const w = wheelCanvas.width;
        const h = wheelCanvas.height;

        ctx.clearRect(0, 0, w, h);

        // center
        const cx = w / 2,
          cy = h / 2;
        const r = Math.min(w, h) * 0.45;

        // background glow
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(rotation);

        // If no users
        if (users.length === 0) {
          ctx.fillStyle = "rgba(255,255,255,.08)";
          ctx.beginPath();
          ctx.arc(0, 0, r, 0, Math.PI * 2);
          ctx.fill();

          ctx.rotate(-rotation);
          ctx.fillStyle = "rgba(255,255,255,.65)";
          ctx.font = `700 ${Math.floor(r * 0.12)}px ui-sans-serif, system-ui`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("Add users →", 0, 0);
          ctx.restore();
          return;
        }

        const n = users.length;
        const step = (Math.PI * 2) / n;

        for (let i = 0; i < n; i++) {
          const start = i * step;
          const end = start + step;

          // slice
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.arc(0, 0, r, start, end);
          ctx.closePath();

          // gradient slice
          const grad = ctx.createRadialGradient(0, 0, r * 0.1, 0, 0, r);
          grad.addColorStop(0, "rgba(255,255,255,.08)");
          grad.addColorStop(0.35, users[i].color);
          grad.addColorStop(1, "rgba(0,0,0,.28)");
          ctx.fillStyle = grad;
          ctx.fill();

          // slice border
          ctx.strokeStyle = "rgba(255,255,255,.15)";
          ctx.lineWidth = Math.max(2, r * 0.01);
          ctx.stroke();

          // text
          const mid = (start + end) / 2;
          ctx.save();
          ctx.rotate(mid);
          ctx.translate(r * 0.66, 0);
          ctx.rotate(Math.PI / 2);

          ctx.fillStyle = "rgba(255,255,255,.92)";
          ctx.font = `800 ${Math.floor(r * 0.08)}px ui-sans-serif, system-ui`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";

          const label = users[i].name;
          drawFittedText(ctx, label, 0, 0, r * 0.85);

          ctx.restore();
        }

        // center hub
        ctx.save();
        ctx.rotate(-rotation);
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.18, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(0,0,0,.25)";
        ctx.fill();
        ctx.strokeStyle = "rgba(255,255,255,.18)";
        ctx.lineWidth = r * 0.012;
        ctx.stroke();

        ctx.fillStyle = "rgba(255,255,255,.92)";
        ctx.font = `900 ${Math.floor(r * 0.085)}px ui-sans-serif, system-ui`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("SPIN", 0, 0);
        ctx.restore();

        ctx.restore();
      }

      function drawFittedText(ctx, text, x, y, maxWidth) {
        // shrink text if too long
        let size = parseInt(ctx.font.match(/\d+/)?.[0] || "24", 10);
        while (ctx.measureText(text).width > maxWidth && size > 10) {
          size -= 1;
          ctx.font = ctx.font.replace(/\d+px/, `${size}px`);
        }
        ctx.fillText(text, x, y);
      }

      // ---------- Winner math ----------
      // Pointer is at the top. In our drawing, slice i occupies angles [i*step, (i+1)*step] in wheel local coords.
      // With rotation applied, the world angle under pointer is (-rotation - PI/2) in wheel local coords (because top is -PI/2).
      // We can compute index from that.
      function indexAtPointer() {
        if (!users.length) return null;
        const n = users.length;
        const step = (Math.PI * 2) / n;

        let a = (-rotation - Math.PI / 2) % (Math.PI * 2);
        if (a < 0) a += Math.PI * 2;

        const idx = Math.floor(a / step);
        return clamp(idx, 0, n - 1);
      }

      // ---------- Spin animation ----------
      function spin() {
        if (isSpinning) return;
        hideWinner();
        if (users.length < 2) {
          pulseHint("Add at least 2 users");
          return;
        }

        isSpinning = true;
        shuffleBtn.disabled = true;
        addBtn.disabled = true;
        clearBtn.disabled = true;
        nameInput.disabled = true;

        // Choose a random winner index
        targetIndex = Math.floor(Math.random() * users.length);

        // We want the pointer (top) to land on targetIndex
        const n = users.length;
        const step = (Math.PI * 2) / n;

        // angle where target slice center should be under pointer
        const targetCenter = targetIndex * step + step / 2;

        // pointer corresponds to local angle a = (-rotation - PI/2)
        // We want: (-rotation_end - PI/2) ≡ targetCenter (mod 2π)
        // => rotation_end ≡ -(targetCenter + PI/2) (mod 2π)
        let desired = -(targetCenter + Math.PI / 2);

        // add multiple full spins for drama
        const extraSpins = Math.floor(rand(5, 9)); // 5-8 spins
        const end = desired + extraSpins * Math.PI * 2;

        const startRot = rotation;
        const delta = end - startRot;

        const duration = rand(2400, 3400);
        const start = performance.now();

        winnerName.textContent = "…";
        spinInfo.textContent = "Spinning";
        spinInfo.style.boxShadow = "0 0 18px rgba(0,212,255,.25)";

        function easeOutCubic(t) {
          return 1 - Math.pow(1 - t, 3);
        }
        function tick(now) {
          const t = clamp((now - start) / duration, 0, 1);
          const eased = easeOutCubic(t);
          rotation = startRot + delta * eased;
          drawWheel();

          // update live hovered name
          const liveIdx = indexAtPointer();
          if (liveIdx !== null)
            winnerName.textContent = users[liveIdx]?.name ?? "—";

          if (t < 1) {
            requestAnimationFrame(tick);
          } else {
            // snap final
            rotation = startRot + delta;
            drawWheel();

            const finalIdx = indexAtPointer();
            const finalName = finalIdx !== null ? users[finalIdx]?.name : "—";
            winnerName.textContent = finalName;
            spinInfo.textContent = "Done";
            spinInfo.style.boxShadow = "0 0 18px rgba(110,243,197,.22)";

            if (finalIdx !== null) {
              burstConfetti();
              showWinner(finalName);
            }

            isSpinning = false;
            shuffleBtn.disabled = false;
            addBtn.disabled = false;
            clearBtn.disabled = false;
            nameInput.disabled = false;
          }
        }

        requestAnimationFrame(tick);
      }

      // ---------- Confetti ----------
      let confetti = [];
      function burstConfetti() {
        const count = 180;
        const w = confettiCanvas.width;
        const h = confettiCanvas.height;

        for (let i = 0; i < count; i++) {
          confetti.push({
            x: w / 2 + rand(-60, 60) * devicePixelRatio,
            y: h * 0.18 + rand(-10, 10) * devicePixelRatio,
            vx: rand(-5, 5) * devicePixelRatio,
            vy: rand(2, 10) * devicePixelRatio,
            g: rand(0.1, 0.22) * devicePixelRatio,
            r: rand(4, 10) * devicePixelRatio,
            a: rand(0, Math.PI * 2),
            va: rand(-0.2, 0.2),
            life: rand(60, 120),
            color: `hsl(${Math.floor(rand(0, 360))} 90% 60%)`,
          });
        }

        animateConfetti();
      }

      let confettiAnimating = false;
      function animateConfetti() {
        if (confettiAnimating) return;
        confettiAnimating = true;

        function frame() {
          cctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);

          confetti = confetti.filter((p) => p.life > 0);
          for (const p of confetti) {
            p.life -= 1;
            p.vy += p.g;
            p.x += p.vx;
            p.y += p.vy;
            p.a += p.va;

            cctx.save();
            cctx.translate(p.x, p.y);
            cctx.rotate(p.a);
            cctx.fillStyle = p.color;
            cctx.globalAlpha = clamp(p.life / 120, 0, 1);
            cctx.fillRect(-p.r, -p.r * 0.6, p.r * 2, p.r * 1.2);
            cctx.restore();
          }

          if (confetti.length) {
            requestAnimationFrame(frame);
          } else {
            cctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            confettiAnimating = false;
          }
        }
        requestAnimationFrame(frame);
      }

      // ---------- Winner dialog ----------
      // Elements are added near the top of the body
      const winnerOverlay = document.getElementById("winnerOverlay");
      const winnerPopupName = document.getElementById("winnerPopupName");
      const winnerClose = document.getElementById("winnerClose");

      function showWinner(name) {
        if (!winnerOverlay) return;
        winnerPopupName.textContent = name;
        winnerOverlay.hidden = false;
        winnerOverlay.style.pointerEvents = "auto";
        // focus the close button for accessibility
        if (winnerClose) winnerClose.focus();
        document.addEventListener("keydown", onWinnerKeydown);
      }

      function hideWinner() {
        if (!winnerOverlay) return;
        winnerOverlay.hidden = true;
        winnerOverlay.style.pointerEvents = "none";
        document.removeEventListener("keydown", onWinnerKeydown);
      }

      if (winnerClose) {
        winnerClose.addEventListener("click", (e) => {
          e.stopPropagation();
          hideWinner();
        });
      }

      if (winnerOverlay) {
        winnerOverlay.addEventListener("click", (e) => {
          if (e.target === winnerOverlay) hideWinner();
        });
      }

      function onWinnerKeydown(e) {
        if (e.key === "Escape") hideWinner();
      }

      // ---------- UI actions ----------
      function addUser() {
        if (isSpinning) return;
        const val = nameInput.value.trim();
        if (!val) {
          pulseHint("Type a name first");
          return;
        }
        users.push({
          id: crypto.randomUUID(),
          name: val,
          color: hashColor(users.length),
        });
        nameInput.value = "";
        updateUI();
      }

      function clearAll() {
        if (isSpinning) return;
        users = [];
        winnerName.textContent = "—";
        spinInfo.textContent = "Ready";
        updateUI();
      }

      function shuffleUsers() {
        if (isSpinning) return;
        for (let i = users.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [users[i], users[j]] = [users[j], users[i]];
        }
        syncColors();
        updateUI();
      }

      function updateUI() {
        countBadge.textContent = `${users.length} user${users.length === 1 ? "" : "s"}`;
        hint.textContent =
          users.length < 2 ? "Add at least 2 users" : "Ready to spin";
        renderList();
        drawWheel();
      }

      function pulseHint(text) {
        hint.textContent = text;
        hint.style.boxShadow = "0 0 0 0 rgba(255,107,138,.0)";
        hint.style.borderColor = "rgba(255,107,138,.55)";
        hint.style.background = "rgba(255,107,138,.12)";
        setTimeout(() => {
          hint.style.borderColor = "rgba(255,255,255,.14)";
          hint.style.background = "rgba(255,255,255,.10)";
        }, 650);
      }

      // ---------- Events ----------
      wheelCanvas.addEventListener("click", spin);
      addBtn.addEventListener("click", addUser);
      clearBtn.addEventListener("click", clearAll);
      shuffleBtn.addEventListener("click", shuffleUsers);

      nameInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") addUser();
      });

      // initial
      updateUI();
    </script>
  </body>
</html>
